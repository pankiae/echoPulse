[project]
name = "echopulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pankaj", email = "pankajjarial@smardatainc.net" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "google-genai>=0.1.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
echopulse = "echopulse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
